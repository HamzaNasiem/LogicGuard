[project]
name = "avicennaguard"
version = "2.0.0"
description = "Neuro-symbolic middleware for deterministic hallucination interception in LLMs using Avicennian syllogistic frameworks"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hamza Naseem", email = "hamza.naseem2027@gmail.com" },
    { name = "Moiz Ali",     email = "moizk5590@gmail.com"       },
]
keywords = ["LLM", "hallucination", "neuro-symbolic", "AI safety", "knowledge graph", "Ibn Sina"]
license = { text = "MIT" }

dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "ollama>=0.3",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "ruff>=0.4",
    "httpx>=0.27",
]
research = [
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.scripts]
avicennaguard-api = "avicennaguard.cli:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avicennaguard"]

[tool.pytest.ini_options]
testpaths   = ["tests"]
pythonpath  = ["src"]
addopts     = "-v --tb=short"
markers     = [
    "requires_ollama: test requires local Ollama server",
    "slow: test takes more than 10 seconds",
]

[tool.ruff]
line-length = 100
src         = ["src", "tests", "experiments"]

[tool.ruff.lint]
select  = ["E", "F", "W", "I"]
ignore  = ["E501"]

[tool.mypy]
python_version = "3.11"
strict         = false
warn_return_any = true
